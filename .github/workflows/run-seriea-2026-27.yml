name: Serie A 2026-27 fantasy run

on:
  push:
    branches: [run-serie-a-2026-27]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run-serie-a-2026-27

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests lxml html5lib beautifulsoup4

      - name: Build combined 2026-27 + 2025-26 dataset
        shell: bash
        run: |
          set -euo pipefail
          python run_seriea_2026_27_v2.py | tee data_build_output.txt
          cp Fantacalcio_stat.csv Fantacalcio_stat_full_combined.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv('Fantacalcio_stat.csv')
          caps = {'P': 12, 'D': 36, 'C': 36, 'A': 28}
          parts = []
          for role, cap in caps.items():
              g = df[df.R == role].head(cap)
              if len(g) < cap:
                  raise RuntimeError(f'Not enough {role} players: {len(g)} < {cap}')
              parts.append(g)
          out = pd.concat(parts, ignore_index=True)
          out.to_csv('Fantacalcio_stat.csv', index=False)
          out.to_csv('Fantacalcio_stat_auction_pool.csv', index=False)
          print('Auction pool:', len(out), out.R.value_counts().to_dict())
          PY

      - name: Run optimization pipeline
        shell: bash
        env:
          PYTHONHASHSEED: '42'
        run: |
          set -euo pipefail
          printf '4\n500\n25\n3\n3\n8\n8\n8\n8\n6\n6\npso\nde\nes\npso\n' | python main.py | tee console_output.txt

      - name: Validate exact rosters
        run: |
          python - <<'PY'
          import re
          text = open('console_output.txt', encoding='utf-8').read()
          chunks = re.split(r'=== Manager_\d+ ===[^\n]*\n', text)[1:]
          if len(chunks) != 4:
              raise RuntimeError(f'Expected 4 manager outputs, found {len(chunks)}')
          expected = {'P':3, 'D':8, 'C':8, 'A':6}
          for i, chunk in enumerate(chunks, 1):
              chunk = chunk.split('\n===', 1)[0]
              roles = re.findall(r'Role=([PDCA])', chunk)
              counts = {r: roles.count(r) for r in expected}
              if counts != expected or len(roles) != 25:
                  raise RuntimeError(f'Manager_{i} invalid roster: {counts}, total={len(roles)}')
              print(f'Manager_{i} roster validated: {counts}')
          PY

      - name: Save run metadata
        if: always()
        run: |
          {
            echo 'Run date: 2026-10-02'
            echo 'Seasons: Serie A 2026/27 current + 2025/26 previous'
            echo 'Current roster only.'
            echo 'Counting stats: summed across seasons.'
            echo 'MV/FM: appearance-weighted across seasons.'
            echo 'Managers: 4; budget: 500 each; roster: 25; roles: exactly 3P 8D 8C 6A.'
            echo 'Strategies: Manager_1=PSO, Manager_2=DE, Manager_3=ES, Manager_4=PSO.'
            echo 'Auction candidate pool: top 12 P, 36 D, 36 C, 28 A by repository score after blending.'
            echo 'Forced-assignment budget double-deduction fixed on this branch.'
          } > RUN_METADATA.txt

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seriea-2026-27-fantasy-output-4-managers
          path: |
            report.pdf
            console_output.txt
            data_build_output.txt
            RUN_METADATA.txt
            Fantacalcio_stat_2026_27_combined.csv
            Fantacalcio_stat_full_combined.csv
            Fantacalcio_stat_auction_pool.csv
          if-no-files-found: warn
